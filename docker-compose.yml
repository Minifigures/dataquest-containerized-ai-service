services:
  api:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://appuser:${POSTGRES_PASSWORD:-devpassword}@db:5432/optimizer
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL: ${MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: optimizer
    volumes:
      - pgdata:/var/lib/postgresql/data
    # depends_on with condition: service_healthy needs this, otherwise the API
    # starts while Postgres is still initialising. The API survives that now,
    # but it would start without persistence and quietly stay that way.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d optimizer"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
